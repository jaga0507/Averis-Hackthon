<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TitanPort — Cases</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f6f7f8] text-[#17202a]">

<div class="min-h-screen flex">

    <aside class="w-60 bg-[#111c27] text-slate-300 fixed inset-y-0 flex flex-col">

        <div class="px-6 py-6 border-b border-slate-700/60">
            <div class="flex gap-3 items-center">

                <div class="w-9 h-9 bg-slate-100 text-[#111c27] rounded grid place-items-center font-bold">
                    TP
                </div>

                <div>
                    <b class="text-white">TitanPort</b>

                    <div class="text-[9px] tracking-[.18em] text-slate-500">
                        DOCUMENT CONTROL
                    </div>
                </div>

            </div>
        </div>

        <nav class="p-4 space-y-1 text-sm">

            <a href="index.html"
               class="block px-3 py-2.5 rounded hover:bg-slate-800">
                Dashboard
            </a>

            <a href="cases.html"
               class="block px-3 py-2.5 rounded bg-slate-700/70 text-white">
                Cases
            </a>

        </nav>

        <div class="mt-auto p-4 text-[10px] text-slate-500">
            TitanPort Operations · v1.0
        </div>

    </aside>

    <main class="ml-60 flex-1">

        <header class="h-20 bg-white border-b px-9 flex items-center justify-between">

            <div>
                <div class="text-[9px] tracking-[.16em] font-bold text-slate-400">
                    SHIPPING DOCUMENT OPERATIONS
                </div>

                <h1 class="text-xl font-semibold mt-1">
                    Cases
                </h1>
            </div>

            <div class="flex gap-2">

                <input
                    id="search"
                    class="border rounded px-3 py-2 text-xs w-64 outline-none focus:ring-2 focus:ring-slate-200"
                    placeholder="Search cases..."
                >

            </div>

        </header>

        <div class="p-9 max-w-[1450px] mx-auto">

            <div class="grid grid-cols-4 gap-4 mb-5">

                <div class="bg-white border rounded-xl p-4">
                    <div class="text-xs text-slate-500">
                        All cases
                    </div>

                    <b id="all-count" class="text-2xl block mt-1">
                        —
                    </b>
                </div>

                <div class="bg-white border rounded-xl p-4">
                    <div class="text-xs text-slate-500">
                        Open
                    </div>

                    <b id="open-count" class="text-2xl block mt-1">
                        —
                    </b>
                </div>

                <div class="bg-white border rounded-xl p-4">
                    <div class="text-xs text-slate-500">
                        Review
                    </div>

                    <b id="review-count" class="text-2xl block mt-1">
                        —
                    </b>
                </div>

                <div class="bg-white border rounded-xl p-4">
                    <div class="text-xs text-slate-500">
                        Resolved
                    </div>

                    <b id="resolved-count" class="text-2xl block mt-1">
                        —
                    </b>
                </div>

            </div>

            <section class="bg-white border rounded-xl overflow-hidden">

                <div class="px-5 py-4 border-b">

                    <b class="text-sm">
                        Case queue
                    </b>

                    <p class="text-xs text-slate-500 mt-1">
                        Cases currently stored in the database
                    </p>

                </div>

                <div class="grid grid-cols-[1.6fr_1fr_1fr_1fr_.7fr] px-5 py-3 bg-slate-50 text-[9px] font-bold tracking-wider text-slate-400">

                    <span>CASE</span>
                    <span>SHIPMENT</span>
                    <span>CATEGORY</span>
                    <span>STATUS</span>
                    <span>DOCS</span>

                </div>

                <div id="case-list"></div>

            </section>

        </div>

    </main>

</div>
<script>

const API_BASE = "http://localhost:8000";

let allCases = [];

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function statusClass(status) {

    const value = String(status ?? "").toUpperCase();

    if (value === "RESOLVED" || value === "CLOSED") {
        return "bg-emerald-50 text-emerald-700";
    }

    if (value === "AWAITING_REVIEW" || value === "AWAITING REVIEW") {
        return "bg-amber-50 text-amber-700";
    }

    if (value === "AWAITING_DOCUMENT" || value === "AWAITING DOCUMENT") {
        return "bg-orange-50 text-orange-700";
    }

    if (value === "OPEN") {
        return "bg-blue-50 text-blue-700";
    }

    return "bg-slate-100 text-slate-600";
}

function extractCases(payload) {

    console.log("RAW /cases RESPONSE:", payload);

    // Possible API formats
    if (Array.isArray(payload)) {
        return payload;
    }

    if (Array.isArray(payload.cases)) {
        return payload.cases;
    }

    if (Array.isArray(payload.data)) {
        return payload.data;
    }

    if (payload.data && Array.isArray(payload.data.cases)) {
        return payload.data.cases;
    }

    if (payload.result && Array.isArray(payload.result.cases)) {
        return payload.result.cases;
    }

    return [];
}

function updateStats(cases) {

    document.getElementById("all-count").textContent =
        cases.length;

    document.getElementById("open-count").textContent =
        cases.filter(c =>
            ["OPEN"].includes(
                String(c.status ?? "").toUpperCase()
            )
        ).length;

    document.getElementById("review-count").textContent =
        cases.filter(c =>
            ["AWAITING_REVIEW", "AWAITING REVIEW"].includes(
                String(c.status ?? "").toUpperCase()
            )
        ).length;

    document.getElementById("resolved-count").textContent =
        cases.filter(c =>
            ["RESOLVED"].includes(
                String(c.status ?? "").toUpperCase()
            )
        ).length;
}

function renderCases(cases) {

    const container = document.getElementById("case-list");

    if (!cases.length) {

        container.innerHTML = `
            <div class="p-10 text-center">

                <div class="text-sm font-semibold text-slate-600">
                    No cases returned by the API.
                </div>

                <div class="text-xs text-slate-400 mt-2">
                    Check the browser console for the raw API response.
                </div>

            </div>
        `;

        return;
    }

    container.innerHTML = cases.map(c => {

        const caseId = c.id ?? c.case_id;

        return `

            <a
                href="case-detail.html?id=${encodeURIComponent(caseId)}"
                class="grid grid-cols-[1.6fr_1fr_1fr_1fr_.7fr] px-5 py-4 border-t items-center hover:bg-slate-50"
            >

                <div>

                    <b class="text-sm">
                        ${escapeHtml(c.case_ref ?? "—")}
                    </b>

                    <div class="text-xs text-slate-500 mt-1">
                        ${escapeHtml(c.title ?? "")}
                    </div>

                </div>

                <span class="text-sm">
                    ${escapeHtml(c.shipment_ref ?? "—")}
                </span>

                <span class="text-xs">
                    ${escapeHtml(c.category ?? "—")}
                </span>

                <span>

                    <span class="px-2 py-1 rounded ${statusClass(c.status)} text-[10px] font-semibold">
                        ${escapeHtml(c.status ?? "—")}
                    </span>

                </span>

                <span class="text-sm">
                    ${escapeHtml(
                        c.document_count ??
                        c.documents_count ??
                        0
                    )}
                </span>

            </a>

        `;

    }).join("");
}

async function loadCases() {

    const container = document.getElementById("case-list");

    try {

        container.innerHTML = `
            <div class="p-10 text-center text-sm text-slate-500">
                Loading cases...
            </div>
        `;

        const response = await fetch(
            `${API_BASE}/cases`,
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        console.log("HTTP STATUS:", response.status);

        const text = await response.text();

        console.log("RAW RESPONSE TEXT:", text);

        if (!response.ok) {
            throw new Error(
                `GET /cases returned HTTP ${response.status}`
            );
        }

        let payload;

        try {
            payload = JSON.parse(text);
        } catch {
            throw new Error(
                "PHP returned something that is not valid JSON."
            );
        }

        allCases = extractCases(payload);

        console.log("EXTRACTED CASES:", allCases);

        updateStats(allCases);
        renderCases(allCases);

    } catch (error) {

        console.error("CASE LOAD ERROR:", error);

        container.innerHTML = `

            <div class="p-10 text-center">

                <div class="text-sm font-semibold text-red-600">
                    Failed to load cases
                </div>

                <div class="text-xs text-slate-500 mt-2">
                    ${escapeHtml(error.message)}
                </div>

                <div class="text-xs text-slate-400 mt-3">
                    Open the browser console with F12 for details.
                </div>

            </div>

        `;
    }
}

document.getElementById("search").addEventListener(
    "input",
    function () {

        const query =
            this.value.trim().toLowerCase();

        if (!query) {
            renderCases(allCases);
            return;
        }

        const filtered = allCases.filter(c => {

            const text = [
                c.case_ref,
                c.shipment_ref,
                c.title,
                c.category,
                c.status,
                c.sender
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(query);
        });

        renderCases(filtered);
    }
);

loadCases();

</script>

</body>
</html>
